apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Development environment configuration
namespace: n8n-dev

resources:
  - namespace.yaml  # Namespace definition
  - ../../base      # Base resources

patchesStrategicMerge:
  - ../common/resources-small.yaml  # Small resource profile
  - ../common/env-dev.yaml          # Development environment variables

# Environment-specific secrets
secretGenerator:
  - name: postgres-secret
    envs:
      - ../common/secrets-dev.env
    type: Opaque
  - name: n8n-secret
    envs:
      - ../common/secrets-dev.env
    type: Opaque

# Environment-specific configs
configMapGenerator:
  - name: n8n-config
    behavior: merge
    envs:
      - ../common/config-dev.env

commonLabels:
  environment: dev