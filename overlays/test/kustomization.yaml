apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Test environment configuration
namespace: n8n-test

resources:
  - namespace.yaml  # Namespace definition
  - ../../base      # Base resources

patchesStrategicMerge:
  - ../common/resources-small.yaml  # Small resource profile
  - ../common/env-test.yaml         # Test environment variables

# Environment-specific secrets
secretGenerator:
  - name: postgres-secret
    envs:
      - ../common/secrets-test.env
    type: Opaque
  - name: n8n-secret
    envs:
      - ../common/secrets-test.env
    type: Opaque

commonLabels:
  environment: test