apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production environment configuration
namespace: n8n-prod

resources:
  - namespace.yaml  # Namespace definition
  - ../../base      # Base resources

patchesStrategicMerge:
  - ../common/resources-large.yaml  # Large resource profile
  - ../common/env-prod.yaml         # Production environment variables

# Environment-specific secrets
secretGenerator:
  - name: postgres-secret
    envs:
      - ../common/secrets-prod.env
    type: Opaque
  - name: n8n-secret
    envs:
      - ../common/secrets-prod.env
    type: Opaque

# Environment-specific configs
configMapGenerator:
  - name: n8n-config
    behavior: merge
    envs:
      - ../common/config-prod.env

commonLabels:
  environment: prod