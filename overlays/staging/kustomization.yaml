apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Staging environment configuration
namespace: n8n-staging

resources:
  - namespace.yaml  # Namespace definition
  - ../../base      # Base resources

patchesStrategicMerge:
  - ../common/resources-medium.yaml  # Medium resource profile
  - ../common/env-staging.yaml       # Staging environment variables

# Environment-specific secrets
secretGenerator:
  - name: postgres-secret
    envs:
      - ../common/secrets-staging.env
    type: Opaque
  - name: n8n-secret
    envs:
      - ../common/secrets-staging.env
    type: Opaque

commonLabels:
  environment: staging