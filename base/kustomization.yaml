apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base resources for all environments
resources:
  - storageclass.yaml  # Storage class definition
  - postgres           # PostgreSQL database resources
  - n8n                # n8n application resources

commonLabels:
  app.kubernetes.io/part-of: n8n-platform

# Common configuration for all environments
configMapGenerator:
  - name: n8n-config
    behavior: merge
    literals:
      - DATABASE_TYPE=postgresql

# Variables to be used in resources
vars:
  - name: STORAGE_CLASS
    objref:
      kind: StorageClass
      name: ebs-sc
      apiVersion: storage.k8s.io/v1