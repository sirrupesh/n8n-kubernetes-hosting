apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-config
data:
  # AWS Configuration
  certificate-arn: "${CERTIFICATE_ARN}"
  
  # N8N Configuration
  N8N_PORT: "5678"
  N8N_PROTOCOL: "https"
  N8N_HOST: "${N8N_HOST}"  # Will be replaced by environment-specific value
  
  # Security Settings
  N8N_SECURE_COOKIE: "true"
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
  
  # Feature Flags
  N8N_RUNNERS_ENABLED: "true"
  N8N_METRICS_ENABLED: "true"
  
  # Database Configuration
  DB_TYPE: "postgresdb"
  DB_POSTGRESDB_HOST: "postgres-service"
  DB_POSTGRESDB_DATABASE: "n8n"