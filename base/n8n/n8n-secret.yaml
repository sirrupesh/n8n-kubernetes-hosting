apiVersion: v1
kind: Secret
metadata:
  name: n8n-secret
  namespace: my-ns-101
type: Opaque
stringData:
  # These are example values - replace them with your actual secure values
  N8N_ENCRYPTION_KEY: "replace-with-your-secure-encryption-key"
  N8N_BASIC_AUTH_USER: "admin"
  N8N_BASIC_AUTH_PASSWORD: "change-this-password"
