apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# n8n application resources
resources:
  - n8n-config.yaml     # Configuration
  - n8n-pvc.yaml        # Persistent volume claim
  - n8n-deployment.yaml # Deployment
  - n8n-service.yaml    # Service
  - n8n-ingress.yaml    # Ingress
  - n8n-secret.yaml     # Secrets

# Certificate ARN replacement for ingress
replacements:
  - source:
      kind: ConfigMap
      name: n8n-config
      fieldPath: data.certificate-arn
    targets:
      - select:
          kind: Ingress
          name: n8n-ingress
        fieldPaths:
          - metadata.annotations.alb\\.ingress\\.kubernetes\\.io/certificate-arn